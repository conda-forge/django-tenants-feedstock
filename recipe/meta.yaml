{% set name = "django-tenants" %}
{% set version = "4.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6ab8b38d741879e21861e02013684c4e494ffbd7bf7d859136ed55ece072220c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - django <6.2,>=5.2
    # - psycopg <3.3,>=3.2.1
    # - gunicorn ==23
    # - coverage 
    # - psycopg <3.3,>=3.2.1
    # - gunicorn ==23
    # - coverage 
    # - psycopg <3.3,>=3.2.1
    # - gunicorn ==25.1.0
    # - coverage 
    # - psycopg <3.3,>=3.2.1
    # - mypy 
    # - gunicorn ==26.0.0
    # - coverage 
    # - psycopg <3.3,>=3.2.1
    # - mypy 
    # - gunicorn ==26.0.0
    # - coverage 
    # - psycopg <3.3,>=3.2.1
    # - mypy 
    # - gunicorn ==26.0.0
    # - coverage 
    # - psycopg <3.4,>=3.2.1
    # - mypy 
    # - gunicorn ==26.2.0
    # - coverage 
    # - psycopg <3.4,>=3.2.1
    # - mypy 
    # - gunicorn ==26.2.0
    # - coverage 
    # - psycopg <3.4,>=3.2.1
    # - mypy 
    # - gunicorn ==26.2.0
    # - coverage 

test:
  imports:
    - django_tenants
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/django-tenants/django-tenants
  summary: Tenant support for Django using PostgreSQL schemas.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
